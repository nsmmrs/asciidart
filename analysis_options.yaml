include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Generated files (see tool/embed_data.dart and the CLI help-topics
    # generator); their style is the generator's business, and their
    # correctness is covered by round-trip tests, not lints.
    - lib/src/data.g.dart
    - lib/src/cli/help_topics.g.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Converters and their tests assemble byte-exact HTML/XML and XPath from
    # adjacent literals split at tag boundaries ('<pre class="x">' '<code>'),
    # where inserting whitespace would change the output. The rule assumes
    # prose, so it is disabled here once instead of per file.
    missing_whitespace_between_adjacent_strings: false
