name: fonts
description: >-
  TrueType, OpenType, WOFF and WOFF2 fonts in pure Dart: reading,
  subsetting, and finding the fonts installed on a machine by family and
  style.
version: 0.1.0-dev
# Not publishable while compression is a git dependency (publish it first).
publish_to: none
repository: https://github.com/nsmmrs/fonts
issue_tracker: https://github.com/nsmmrs/fonts/issues
topics:
  - fonts
  - opentype
  - truetype
  - woff

environment:
  sdk: ^3.13.0

dependencies:
  compression:
    git:
      url: https://github.com/nsmmrs/compression.git
      ref: 51b29595a17f9de9455b26c311df06075e50a9b1
  meta: ^1.16.0

dev_dependencies:
  analyzer: ^14.4.0
  crypto: ^3.0.6
  test: ^1.32.0
  very_good_analysis: ^11.0.0
