name: plain_fonts
description: >-
  TrueType, OpenType, WOFF and WOFF2 fonts in pure Dart: reading,
  subsetting, and finding the fonts installed on a machine by family and
  style.
version: 0.1.0-dev
repository: https://github.com/nsmmrs/ptome/tree/master/packages/plain_fonts
issue_tracker: https://github.com/nsmmrs/ptome/issues
topics:
  - fonts
  - opentype
  - truetype
  - woff

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  meta: ^1.16.0
  plain_compression: ^0.1.0-dev

dev_dependencies:
  analyzer: ^14.4.0
  crypto: ^3.0.6
  test: ^1.32.0
  very_good_analysis: ^11.0.0
