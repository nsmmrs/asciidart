# The pool: repositories whose AsciiDoc documents (and Ruby test heredocs)
# are measured, cut down and sanitized into cases/anchor. Fetched at these
# commits into $ASCII_DOCS_CACHE/pool/src; never committed, whatever the
# license, since only sanitized structure reaches the corpus.
#
# documents: globs of document files; heredocs: globs of Ruby files whose
# <<~ heredocs are documents; sparse: paths to check out (default: all).

