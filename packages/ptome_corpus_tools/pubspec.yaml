name: ptome_corpus_tools
description: Builds ptome's black-box corpus (packages/ptome/test/corpus) from Asciidoctor and ptome runs. Pool, sanitizer, generator, fuzzer. Not published.
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

executables:
  corpus: corpus

dependencies:
  args: ^2.7.0
  # ptome from the workspace (ADR-0018): its results are recorded as the
  # ptome profile.
  ptome: ^0.1.0
  crypto: ^3.0.7
  glob: ^2.2.0
  path: ^1.9.1
  toml: ^0.18.0
  vm_service: ^15.3.0
  xml: ^7.1.0
  image: ^4.10.1
