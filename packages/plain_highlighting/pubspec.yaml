name: plain_highlighting
description: Syntax highlighting for 190+ languages in pure Dart, compatible with highlight.js 11.12.0 (a port, not affiliated with highlight.js).
version: 0.1.0
repository: https://github.com/nsmmrs/ptome/tree/master/packages/plain_highlighting
issue_tracker: https://github.com/nsmmrs/ptome/issues
topics:
  - syntax-highlighting
  - highlighting
  - code

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  meta: ^1.16.0
  plain_compression: ^0.1.0-dev
  plain_unicode: ^0.1.0-dev

dev_dependencies:
  test: ^1.32.0
  very_good_analysis: ^11.0.0
