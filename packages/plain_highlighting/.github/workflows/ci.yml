name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool example
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --dry-run

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
        working-directory: tool/generate
      - name: Generated files are up to date
        run: |
          node tool/generate/generate.mjs
          node tool/generate/reference.mjs
          git diff --exit-code
      - name: vendor/ matches the pinned release
        run: tool/vendor.sh --check
