name: plain_pdf
description: >-
  A pure-Dart PDF library written from ISO 32000: a writer and a reader,
  fonts, images, drawing and SVG, and a backend for plain_typesetting's
  layouts.
version: 0.1.0-dev
repository: https://github.com/nsmmrs/ptome/tree/master/packages/plain_pdf
issue_tracker: https://github.com/nsmmrs/ptome/issues
topics:
  - pdf
  - typesetting

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  meta: ^1.16.0
  plain_compression: ^0.1.0-dev
  plain_fonts: ^0.1.0-dev
  plain_math: ^0.1.0-dev
  plain_typesetting: ^0.1.0-dev
  plain_unicode: ^0.1.0-dev
  xml: ^7.1.0

dev_dependencies:
  analyzer: ^14.4.0
  test: ^1.32.0
  very_good_analysis: ^11.0.0
