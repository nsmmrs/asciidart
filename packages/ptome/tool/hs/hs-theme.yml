# A print theme for the Hypermedia Systems acceptance run, modeled on the
# book's Typst edition (US Letter, wide inside margins, a serif body with
# first-line indents, running heads). The fonts are the ones the AsciiDoc
# edition shipped (Yrsa, SIL OFL), read from the book's fonts/ directory.
extends: default
font:
  catalog:
    merge: true
    Yrsa:
      normal: Yrsa-Regular.ttf
      bold: Yrsa-Bold.ttf
      italic: Yrsa-Italic.ttf
      bold_italic: Yrsa-BoldItalic.ttf
page:
  size: Letter
  margin: [1in, 1in, 1.25in, 1in]
  margin-inner: 1.75in
  margin-outer: 1in
base:
  font-family: Yrsa
  font-size: 12
  line-height: 1.3
  text-align: justify
prose:
  margin-bottom: 0
  text-indent: 0
  text-indent-inner: 1em
heading:
  font-family: Yrsa
  font-style: bold
  h1-font-size: 28
  h2-font-size: 24
  h3-font-size: 16
  h4-font-size: 13
code:
  font-size: 9
  border-width: 0
  background-color: transparent
  padding: [4, 12]
sidebar:
  background-color: transparent
  border-width: 0.5
  border-radius: 0
footer:
  height: 0.75in
  recto:
    right:
      content: '{page-number}'
    left:
      content: '{chapter-title}'
  verso:
    left:
      content: '{page-number}'
    right:
      content: '{document-title}'
