extends: ./../base-theme.yml
list:
  text-align: left
  indent: 0
  body-indent: 5
  item-spacing: 6.5
  margin-top: 12
  margin-bottom: 12
olist:
  body-indent: 5
  marker-width: auto
ulist:
  marker:
    disc:
      content: "\u2022"
description-list:
  term-display: inline
  term-gap: 0.6em
  term-font-style: bold
  description-indent: 2em
  item-spacing: 0.65em
  margin-top: 12
  margin-bottom: 12
page:
  size: [110pt, 2000pt]
prose:
  text-indent-inner: 0.5cm
