description = "the bodymatter landmark is the first chapter after the front matter. The landmarks' \"Start of Content\" (bodymatter) is the first chapter in asciidoctor-epub3 2.3.0, even when that chapter is the dedication or a preface; readers that jump to the start of the content land in the front matter. It is the first chapter after the front matter. Fails on the gem. An EPUB must be complete in itself. With source-highlighter=highlight.js, asciidoctor-epub3 2.3.0 links highlight.js's stylesheet and scripts at /highlight.js/9.18.3/ (outside the container, where no reader finds them; EPUBCheck reports it). ptome highlights the code at conversion and packs the theme's stylesheet. Found building the Hypermedia Systems book with its code highlighted. Fails on the gem.  The gem's EPUB converter is a separate command: set ASCIIDOCTOR_EPUB3_EXE to it when ASCIIDOCTOR_EXE is the Ruby CLI."
source = "handmade:test/divergences/epub_output.bats"
features = ["divergence"]
divergence = "ptome benchmark/PARITY.md"
formats = ["epub3"]
