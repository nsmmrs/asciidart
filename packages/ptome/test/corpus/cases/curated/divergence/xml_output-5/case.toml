description = "a copyright gives its year before its holder. The copyright (`:copyright: Holder 2023`) gave <copyright> with the holder before the year, and with no year when the attribute has none: DocBook 5.0 wants one or more years first, so neither validates. ptome writes the year first, and a copyright without a year as a legal notice. Found by the Hypermedia Systems acceptance run. Fails on the gem. DocBook output must be well-formed XML. An index term that starts with an underscore (`_hyperscript`) before constrained emphasis lets the emphasis open inside the term and close in the text after it: Asciidoctor 2.0.26 writes `<primary><emphasis>hyperscript</primary>` and a stray `</emphasis>`. Found by the Hypermedia Systems acceptance run; ptome balances the tags (benchmark/PARITY.md). Fails on the gem."
source = "handmade:test/divergences/xml_output.bats"
features = ["divergence"]
divergence = "ptome benchmark/PARITY.md"
formats = ["docbook5"]

[options]
standalone = true
