description = "emphasis inside monospace gives a phrase in the literal. Emphasis inside monospace gave <emphasis> inside <literal>, which DocBook doesn't allow: ptome writes a phrase. Fails on the gem. DocBook output must be well-formed XML. An index term that starts with an underscore (`_hyperscript`) before constrained emphasis lets the emphasis open inside the term and close in the text after it: Asciidoctor 2.0.26 writes `<primary><emphasis>hyperscript</primary>` and a stray `</emphasis>`. Found by the Hypermedia Systems acceptance run; ptome balances the tags (benchmark/PARITY.md). Fails on the gem."
source = "handmade:test/divergences/xml_output.bats"
features = ["divergence"]
divergence = "ptome benchmark/PARITY.md"
formats = ["docbook5"]
