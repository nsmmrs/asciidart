# The implementations whose outputs the corpus records. Each case stores one
# expected output per profile and format (cases/**/versions.toml).
#
# Ruby profiles run packages/ptome_corpus_tools/drivers/ruby/worker.rb against
# an Asciidoctor checkout, which its tool/setup.sh clones into
# $ASCII_DOCS_CACHE/refs/<profile> (with the profile's own gems, if any, in
# $ASCII_DOCS_CACHE/gems-<profile>).

["asciidoctor-2.0.26"]
kind = "ruby"
repo = "https://github.com/asciidoctor/asciidoctor.git"
commit = "0b99b39c9df884d4aec13bba45f03cdbab505769"

["asciidoctor-main"]
kind = "ruby"
repo = "https://github.com/asciidoctor/asciidoctor.git"
commit = "30fb8cd5f7145c57274b04524ceaa99812f830e0"

# asciidoctor-pdf 2.3.27 on Asciidoctor 2.0.26, with text-hyphen and no other
# optional gems: the golden PDFs. ptome's PDF (with asciidoctor-compat)
# must have the same pages, pixel for pixel (ptome's pdf-compare-to).
["asciidoctor-pdf"]
kind = "ruby"
repo = "https://github.com/asciidoctor/asciidoctor.git"
commit = "0b99b39c9df884d4aec13bba45f03cdbab505769"
gems = ["asciidoctor-pdf:2.3.27", "text-hyphen:1.5.0", "base64:0.3.0", "bigdecimal:4.1.3", "logger:1.7.0", "ostruct:0.6.3"]
requires = ["asciidoctor-pdf"]
formats = ["pdf"]

# ptome in-process, at the commit pubspec.yaml pins. Asciidoctor's
# stylesheet (asciidoctor-compat) so that every difference from
# asciidoctor-main is a fixed upstream bug (ptome's ADR-0017).
[ptome]
kind = "ptome"
compare-to = "asciidoctor-main"
pdf-compare-to = "asciidoctor-pdf"

[ptome.attributes]
asciidoctor-compat = "true@"
