description: "a copyright gives its year before its holder. DocBook output must be well-formed XML. An index term that starts with an underscore (`_hyperscript`) before constrained emphasis lets the emphasis open inside the term and close in the text after it: Asciidoctor 2.0.26 writes `<primary><emphasis>hyperscript</primary>` and a stray `</emphasis>`. Found by the Hypermedia Systems acceptance run; ptome balances the tags (benchmark/PARITY.md). Fails on the gem."
format: docbook5
standalone: true
contains_joined:
  - "<copyright><year>2023</year><holder>Jane Doe</holder></copyright>"
