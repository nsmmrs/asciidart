description: "unchanged: counters in titles of blocks with and without IDs. asciidoctor#1333: a block title is interpolated on first use: a cross reference converted before the block it points to converts that block's title then, so a counter in the titles counted out of document order (and the attribute playback of the earlier block counted again from the start). A block title's counters (and `{set:...}`) are evaluated once, where the title is written, in document order."
format: html5
standalone: false
contains:
  - "<div class=\"title\">Example 1. Item 1</div>\n<div class=\"content\">\n<div class=\"paragraph\">\n<p>first</p>"
  - "<div class=\"title\">Example 2. Item 2</div>\n<div class=\"content\">\n<div class=\"paragraph\">\n<p>second</p>"
  - "<div class=\"title\">Example 3. Item 3</div>\n<div class=\"content\">\n<div class=\"paragraph\">\n<p>third</p>"
