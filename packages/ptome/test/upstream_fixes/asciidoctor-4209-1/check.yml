description: "an assigned firstname wins over the one computed from author. asciidoctor#4209: when the author comes from the author or authors attribute, only an assigned authorinitials survived; an assigned firstname, middlename or lastname was replaced by the computed one. They all win now, as they do over an implicit author line."
format: html5
standalone: false
contains:
