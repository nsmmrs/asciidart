description: "unchanged: a conditional around a whole block. asciidoctor#3877: an attribute entry inside a delimited block wasn't seen by the preprocessor directives after it in the same block: the block's lines were preprocessed (its ifdef, ifndef and include directives evaluated) before the entries in them were read, so `ifdef` reported the attribute as unset. Directives in a block now run in document order, as they do outside blocks."
format: html5
standalone: false
excludes:
  - "hidden"
contains:
  - "<p>shown</p>"
