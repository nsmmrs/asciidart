description: "and a crafted width on an inline image. asciidoctor#2661: a quote in an image attribute (align, float, width, role, link...) ended the HTML attribute it was written into, letting the rest of the value into the markup."
format: html5
standalone: false
excludes:
  - " onload=\"x\""
contains:
  - "width=\"1&quot; onload=&quot;x\""
