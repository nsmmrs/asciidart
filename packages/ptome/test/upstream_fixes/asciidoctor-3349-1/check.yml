description: "an invalid column spec keeps its column and is reported. asciidoctor#3349: a record of the cols attribute that isn't a column spec (`20strong`) silently dropped its column, so every row overran the table and its cells were dropped with errors that pointed elsewhere. The column stays, as a default one, and the record is reported."
format: html5
standalone: false
warns:
  - "invalid column spec in cols attribute: 20strong; using a default column"
contains:
  - "<p>d</p>"
counts:
  "\n<col ": 4
