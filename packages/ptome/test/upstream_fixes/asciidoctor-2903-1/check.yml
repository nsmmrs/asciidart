description: "footnotes in titles are numbered in document order. asciidoctor#2903: a footnote in a section title was numbered when the parser converted the title to generate the section's ID, before the footnotes of the blocks above it: two footnotes got number 1, and the number ended up in the ID."
format: html5
standalone: false
contains:
  - "<h3 id=\"_h3\">H3<sup class=\"footnote\">[<a id=\"_footnoteref_2\" class=\"footnote\" href=\"#_footnotedef_2\" title=\"View footnote.\">2</a>]</sup></h3>"
  - "<a href=\"#_footnoteref_2\">2</a>. fn 2"
  - "<a href=\"#_footnoteref_3\">3</a>. fn 3"
