description: "a cross reference shows the title as numbered. asciidoctor#1333: a block title is interpolated on first use: a cross reference converted before the block it points to converts that block's title then, so a counter in the titles counted out of document order (and the attribute playback of the earlier block counted again from the start). A block title's counters (and `{set:...}`) are evaluated once, where the title is written, in document order."
format: html5
standalone: false
contains:
  - "<a href=\"#req\">Requirement 2</a>"
  - "<div class=\"title\">Requirement 1</div>"
  - "<div class=\"title\">Requirement 2</div>"
