description: "highlight.js in an EPUB: the theme's stylesheet inside, no scripts. An EPUB must be complete in itself. With source-highlighter=highlight.js, asciidoctor-epub3 2.3.0 links highlight.js's stylesheet and scripts at /highlight.js/9.18.3/ (outside the container, where no reader finds them; EPUBCheck reports it). ptome highlights the code at conversion and packs the theme's stylesheet. Found building the Hypermedia Systems book with its code highlighted. Fails on the gem.  The gem's EPUB converter is a separate command: set ASCIIDOCTOR_EPUB3_EXE to it when ASCIIDOCTOR_EXE is the Ruby CLI."
format: epub3
epub_excludes:
  - {files: "EPUB/*.xhtml", pattern: "(href|src)=\"(/|https?://)"}
  - {files: "EPUB/*.xhtml", pattern: "<script src="}
epub_contains:
  - {files: "EPUB/styles/*.css", pattern: "hljs-keyword"}
  - {files: "EPUB/*.xhtml", pattern: "class=\"hljs-keyword\""}
