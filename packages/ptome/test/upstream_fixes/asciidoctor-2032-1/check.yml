description: "deep sections use h6. asciidoctor#2032: a leveloffset that pushed a section past level 5 produced heading elements HTML doesn't have (<h9>, <h10>)."
format: html5
standalone: false
contains:
  - "<h6 id=\"_level\">Level</h6>"
  - "<h6 id=\"_sub\">Sub</h6>"
  - "<h6 id=\"_discrete\" class=\"discrete\">Discrete</h6>"
excludes:
  - "<h9"
