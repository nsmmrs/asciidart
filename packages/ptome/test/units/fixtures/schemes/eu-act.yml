scheme:
  # An EU act: article > paragraph `1.` > subparagraph (unnumbered: cited by
  # ordinal, never printed) > point `(a)` or `(1)` > `(i)` > indent. Articles
  # are headings at whatever depth their chapter and section put them; all
  # labels are written (acts are amended by insertion: Article 6a), none
  # steps. Recitals are their own scheme, numbered by stepping.

  eu:
    cite: "Article {{article}}"
    level:
      - name: "article"
        insert: "a"
        break: "heading"
        cite-wrap: "Article %"
        cite-range-wrap: "Articles %"
        gaps: true
        id: "art-{{article}}"
        reftext: "Article {{article}}"
        heading: |-
          [[{{id}},{{reftext}}]]
          {{=}} Article {{article}}: {{title}}
      - name: "paragraph"
        wrap: "%."
        cite-wrap: "(%)"
        insert: "a"
        break: "block"
        stepping: false
        gaps: true
        id: "art-{{article}}-{{paragraph}}"
        reftext: "Article {{article}}({{paragraph}})"
        lower: "[[{{id}},{{reftext}}]]{{label}} "
        lower-block: "[.paragraph]"
      - name: "subparagraph"
        hidden: true
        auto: "paragraph"
        id: "art-{{article}}{{#paragraph}}-{{paragraph}}{{/paragraph}}-s{{subparagraph}}"
        reftext: "Article {{article}}{{#paragraph}}({{paragraph}}){{/paragraph}}, subparagraph {{subparagraph}}"
        lower: "[[{{id}}]]"
      - name: "point"
        type: "alpha|int"
        wrap: "(%)"
        break: "block"
        stepping: false
        gaps: true
        id: "art-{{article}}{{#paragraph}}-{{paragraph}}{{/paragraph}}-{{point}}"
        reftext: "Article {{article}}{{#paragraph}}({{paragraph}}){{/paragraph}}({{point}})"
        lower: "[[{{id}},{{reftext}}]]{{label}} "
        lower-block: "[.point]"
      - name: "subpoint"
        type: "alpha|roman"
        wrap: "(%)"
        break: "block"
        stepping: false
        gaps: true
        id: "art-{{article}}{{#paragraph}}-{{paragraph}}{{/paragraph}}-{{point}}-{{subpoint}}"
        reftext: "Article {{article}}{{#paragraph}}({{paragraph}}){{/paragraph}}({{point}})({{subpoint}})"
        lower: "[[{{id}},{{reftext}}]]{{label}} "
        lower-block: "[.subpoint]"
      # An indent (— …), cited by ordinal ("the second indent"): a list item.
      - name: "indent"
        hidden: true
        auto: "item"
        id: "art-{{article}}{{#paragraph}}-{{paragraph}}{{/paragraph}}{{#point}}-{{point}}{{/point}}-i{{indent}}"
        reftext: "Article {{article}}{{#paragraph}}({{paragraph}}){{/paragraph}}{{#point}}({{point}}){{/point}}, indent {{indent}}"
        lower: "[[{{id}}]]"
  recital:
    level:
      - name: "recital"
        wrap: "(%)"
        cite-wrap: "recital %"
        cite-range-wrap: "recitals %"
        default: true
        id: "rct-{{recital}}"
        reftext: "Recital {{recital}}"
        lower: "[[{{id}},{{reftext}}]]{{label}} "
stream:
  # The Official Journal's footnotes, numbered through the act.
  oj:
    placement: "footnote"
    lower: "{{body}}"
citation:
  # Quoted elsewhere, in the form of the Official Journal: `— Article
  # 6(1)(a) of Regulation (EU) 2016/679`.
  default:
    attribution: "{{passage}} of {{doc.work}}"
    title: ""
