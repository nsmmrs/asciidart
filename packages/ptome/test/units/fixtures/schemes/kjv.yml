stream:
  # The King James Bible's notes, ranges and terms, and how they look in a
  # print reference Bible.

  # The 1611 translators' marginal notes, with their verse and the words
  # they are on.
  tn:
    placement: "footnote"
    reset: "verse"
    origin: "{{chapter}}:{{verse}}"
    origin-style: "strong"
    lemma-style: "emphasis"
    lemma-after: ": "
  # Cross-references: lettered in the verse before the phrase they belong
  # to, gathered into the verse's entry for the center column.
  x:
    placement: "entry"
    caller: "a"
    reset: "verse"
    origin: "{{chapter}}:{{verse}}"
    caller-style: "superscript"
    caller-role: "xref-mark"
    origin-style: "strong"
    caller-after: "\u00a0"
    entry-role: "xref"
    entry-after: " "
range:
  wj:
    role: "wj"
term:
  # LORD, GOD, JEHOVAH in capitals: the divine name, in small capitals.
  divine-name:
    pattern: "(?<![A-Za-z])(?:LORD|GOD|JEHOVAH|JAH)(?![A-Za-z])"
    role: "nd"
    transform: "titlecase"
level-presentation:
  bible:
    book:
      title: "{{book.name}}"
      role: "book"
      attributes:
        short-name: "{{book.abbr}}"
    chapter:
      title: "{{book.chapter-label}} {{chapter}}"
      role: "chapter"
      attributes:
        number: "{{chapter}}"
    verse:
      label: "{{^first}}{{^zero}}{{label}}{{/zero}}{{/first}}"
      label-style: "superscript"
      label-after: "\u00a0"
