name: ascii_docs
description: AsciiDoc conformance corpus for ptome and Asciidoctor, with the tools that build it (pool sanitizer, generator, fuzzer).
publish_to: none

environment:
  sdk: ^3.13.0

executables:
  ascii_docs: ascii_docs

dependencies:
  args: ^2.7.0
  # ptome at a pinned commit; pubspec_overrides.yaml (gitignored) points
  # at a local checkout for development.
  ptome:
    git:
      url: https://github.com/nsmmrs/ptome.git
      ref: d0ae3537d660eba5ec49df1c6c2c349aa14fe24b
  crypto: ^3.0.7
  glob: ^2.2.0
  path: ^1.9.1
  toml: ^0.18.0
  vm_service: ^15.3.0
  xml: ^7.1.0
  image: ^4.10.1
dev_dependencies:
  test: ^1.32.0
