# The pub workspace of ptome and the plain_* libraries (ADR-0018). Not a
# package: each member under packages/ is published on its own.
name: _
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/*
  # plain_pdf's comparison with package:pdf (a benchmark, not published).
  - packages/plain_pdf/benchmark/compare
