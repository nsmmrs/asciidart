name: asciidoctor
description: Dart port of Asciidoctor, the fast text processor for converting AsciiDoc to HTML and more.
version: 0.1.0
homepage: https://asciidoctor.org
repository: https://github.com/nsmmrs/asciidoctor-dart
issue_tracker: https://github.com/nsmmrs/asciidoctor-dart/issues
topics:
  - asciidoc
  - documentation
  - converter
  - markup

environment:
  sdk: ^3.13.0

executables:
  asciidoctor: asciidoctor

dependencies:
  args: ^2.4.0
  mustache_template: ^2.0.6

dev_dependencies:
  lints: ^5.0.0
  test: ^1.32.0
