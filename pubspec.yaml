name: ascii_docs
description: AsciiDoc conformance corpus for asciidart and Asciidoctor, with the tools that build it (pool sanitizer, generator, fuzzer).
publish_to: none

environment:
  sdk: ^3.13.0

executables:
  ascii_docs: ascii_docs

dependencies:
  args: ^2.7.0
  # asciidart at a pinned commit; pubspec_overrides.yaml (gitignored) points
  # at a local checkout for development.
  asciidart:
    git:
      url: https://github.com/nsmmrs/asciidart.git
      ref: 8d9f3d752be63e71f2793503a1f492939f31685f
  crypto: ^3.0.7
  glob: ^2.2.0
  path: ^1.9.1
  toml: ^0.18.0
  vm_service: ^15.3.0
  xml: ^7.1.0
dev_dependencies:
  test: ^1.32.0
