name: asciidart
description: AsciiDoc processor for Dart, compatible with Asciidoctor 2.0.26. Converts AsciiDoc to HTML 5, DocBook 5 and man pages.
version: 0.1.0
repository: https://github.com/nsmmrs/asciidart
issue_tracker: https://github.com/nsmmrs/asciidart/issues
# Not publishable while hilite is a git dependency (publish hilite first).
publish_to: none
topics:
  - asciidoc
  - documentation
  - converter
  - markup

environment:
  sdk: ^3.13.0

executables:
  asciidart: asciidart

dependencies:
  args: ^2.4.0
  # highlight.js for Dart; not on pub.dev yet, so pinned to a commit.
  hilite:
    git:
      url: https://github.com/nsmmrs/hilite.git
      ref: ab4473c8131c2947c9ff9170d70621ed27f31411
  # Our PDF library (the pdf backend's engine); not on pub.dev yet.
  libpdf:
    git:
      url: https://github.com/nsmmrs/libpdf.git
      ref: e40badf7bebb1b49b908719c9c28fa2e74c2cd4e
  meta: ^1.16.0
  mustache_template: ^2.0.6
  yaml: ^3.1.4

dev_dependencies:
  analyzer: ^14.0.0
  test: ^1.32.0
  very_good_analysis: ^11.0.0
