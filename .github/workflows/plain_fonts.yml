name: plain_fonts
on:
  push:
    branches: ['**']
    paths:
    - 'packages/plain_fonts/**'
    - 'packages/plain_compression/**'
    - '.github/workflows/plain_fonts.yml'
  pull_request:
    paths:
    - 'packages/plain_fonts/**'
    - 'packages/plain_compression/**'
    - '.github/workflows/plain_fonts.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
defaults:
  run:
    working-directory: packages/plain_fonts
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies
      run: dart pub get
    - name: Check that JavaScript writes the same bytes as the VM
      run: |
        dart compile js -O2 -o build/web_check.js tool/web_check.dart
        vm="$(dart run tool/web_check.dart)"
        js="$(node build/web_check.js)"
        echo "VM: $vm"; echo "JS: $js"
        test "$vm" = "$js"
    - name: Check the font index on Node.js, the WOFF decoder loaded on demand
      run: |
        dart compile js -O2 -o build/node/node_check.js tool/node_check.dart
        cat tool/node_preamble.js build/node/node_check.js > build/node/run.cjs
        out="$(node build/node/run.cjs test/fonts)"
        echo "$out"
        grep -qx 'passed over web fonts before loading: true' <<<"$out"
        grep -qx 'notoserif-features.woff2: Noto Serif' <<<"$out"
        grep -qx 'libertinus-smcp.otf: Libertinus Serif' <<<"$out"
  tools:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies
      run: dart pub get
    - name: Install woff2
      run: sudo apt-get update -q && sudo apt-get install -yq woff2
    - name: Run the tests that check against woff2_compress and woff2_decompress
      run: dart test --tags tools
