name: plain_math
on:
  push:
    branches: ['**']
    paths:
    - 'packages/plain_math/**'
    - '.github/workflows/plain_math.yml'
  pull_request:
    paths:
    - 'packages/plain_math/**'
    - '.github/workflows/plain_math.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
defaults:
  run:
    working-directory: packages/plain_math
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies
      run: dart pub get
    - name: Check that JavaScript writes the same bytes as the VM
      run: |
        dart compile js -O2 -o build/web_check.js tool/web_check.dart
        vm="$(dart run tool/web_check.dart)"
        js="$(node build/web_check.js)"
        echo "VM: $vm"; echo "JS: $js"
        test "$vm" = "$js"
  tools:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies
      run: dart pub get
    - name: Set up Node.js (Temml and KaTeX)
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install the oracles (Temml and KaTeX with npm)
      run: tool/oracles/setup.sh
    - name: Run the tests that compare with Temml and KaTeX
      run: dart test --tags tools
