name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
# ptome's jobs run in its package folder (the repository is a pub
# workspace, ADR-0018).
defaults:
  run:
    working-directory: packages/ptome
jobs:
  workspace:
    # Every package: analysis and formatting over the whole workspace, the
    # libraries' tests and API snapshots (ptome's are in the jobs below).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies (the whole workspace)
      run: dart pub get
    - name: Analyze every package
      run: dart analyze --fatal-infos .
    - name: Check formatting
      run: dart format --output=none --set-exit-if-changed .
    - name: Test the libraries
      run: |
        for pkg in packages/plain_*/; do
          echo "::group::$pkg"
          (cd "$pkg" && dart test)
          echo "::endgroup::"
        done
    - name: Check the libraries' public APIs against their snapshots
      if: matrix.os == 'ubuntu-latest'
      run: |
        for pkg in packages/plain_*/; do
          [ -f "$pkg/tool/api_check.dart" ] || continue
          (cd "$pkg" && dart run tool/api_check.dart)
        done
  publishable:
    # Each package would publish: no errors or warnings in a dry run (but
    # depending on siblings not released yet; tool/publish_check.sh).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies (the whole workspace)
      run: dart pub get
    - name: Dry-run publishing every package
      run: tool/publish_check.sh
  standalone:
    # Each package resolved on its own against its siblings' published
    # versions (in the workspace they always resolve locally); packages
    # whose siblings aren't published yet are skipped.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Resolve and analyze each package alone
      run: tool/standalone.sh
  dart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies
      run: dart pub get
    - name: Build the executable (every test that runs the CLI uses it)
      shell: bash
      run: |
        ./tool/build-exes.sh
        exe="$(pwd)/dist/$(ls dist | grep '^ptome-')"
        # (A Windows path on Windows, for Dart's Process.run.)
        if command -v cygpath >/dev/null; then exe="$(cygpath -w "$exe")"; fi
        echo "PTOME_EXE=$exe" >> "$GITHUB_ENV"
    - name: Install poppler and qpdf (PDF pages and structure in tests)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils qpdf
    - name: Analyze Dart code
      run: dart analyze --fatal-infos .
    - name: Check Dart formatting
      run: dart format --output=none --set-exit-if-changed .
    - name: Run Dart tests (the corpus has a job of its own)
      run: dart test -x corpus
    - name: Check that the public API is closed
      run: dart run tool/api_check.dart
    - name: Check that the JavaScript projection is up to date
      run: dart run tool/generate_js.dart --check
    - name: Set up Ruby (oracle only)
      if: matrix.os == 'ubuntu-latest'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
    - name: Install the asciidoctor gem from upstream main (e2e oracle)
      if: matrix.os == 'ubuntu-latest'
      # With asciimath, whose conversion ptome ports (AsciiMath becomes
      # MathML in DocBook, ADR-0014). No other optional gems: ptome
      # highlights with highlight.js only, and Rouge, Pygments and CodeRay
      # behave as when their gems are missing.
      run: |
        # Upstream main at the pin in tool/vendor.sh (2.1.0.alpha.0).
        git clone -q https://github.com/asciidoctor/asciidoctor.git "$RUNNER_TEMP/asciidoctor"
        git -C "$RUNNER_TEMP/asciidoctor" checkout -q 30fb8cd5f7145c57274b04524ceaa99812f830e0
        (cd "$RUNNER_TEMP/asciidoctor" && gem build asciidoctor.gemspec && gem install --no-document asciidoctor-*.gem)
        gem install --no-document asciimath:2.0.6
    - name: Install bats
      if: matrix.os == 'ubuntu-latest'
      run: sudo npm i -g bats
    - name: Run e2e CLI tests (Dart exe)
      if: matrix.os == 'ubuntu-latest'
      run: ASCIIDOCTOR_EXE="$PTOME_EXE" bats test/e2e/
    - name: Run e2e CLI tests (Ruby oracle)
      if: matrix.os == 'ubuntu-latest'
      # The same suite against the gem, so every test states the gem's
      # behavior.
      env:
        ASCIIDOCTOR_EXE: test/e2e/bin/asciidoctor-ruby
      run: bats test/e2e/
    - name: Run differential selfcheck
      if: matrix.os == 'ubuntu-latest'
      run: bats test/differential/
    - name: Install asciidoctor-epub3 gem on the main gem (EPUB oracle)
      if: matrix.os == 'ubuntu-latest'
      # Without its asciidoctor dependency, which would bring in the 2.0
      # release; the version line shows the Asciidoctor it runs on.
      run: |
        gem install --no-document gepub -v 1.0.17
        gem install --no-document mime-types sass
        gem install --no-document --ignore-dependencies asciidoctor-epub3 -v 2.3.0
        asciidoctor-epub3 -v | tee /dev/stderr | grep -q 'using Asciidoctor 2.1.0'
    - name: Download EPUBCheck
      if: matrix.os == 'ubuntu-latest'
      run: |
        curl -sSLo "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
        unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
    - name: Check EPUB parity with asciidoctor-epub3 2.3.0 on the main gem
      if: matrix.os == 'ubuntu-latest'
      run: >-
        dart run tool/epub_parity.dart
        --exe-a "$(command -v asciidoctor-epub3)"
        --exe-b "$PTOME_EXE"
        --epubcheck "$RUNNER_TEMP/epubcheck-5.4.0/epubcheck.jar"
        $(find vendor/asciidoctor-epub3/test/fixtures -name '*.adoc' | sort)
  corpus:
    # ptome against the files the Asciidoctor command line writes
    # (test/corpus, ADR-0022): red until compatibility settings close every
    # difference, so apart from the rest.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies
      run: dart pub get
    - name: Install poppler and unzip (PDF pages, EPUB files)
      run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils unzip
    - name: Compare with Asciidoctor's files
      run: dart test -t corpus
  npm:
    # Node.js's current LTS.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Build the npm package
      run: ./tool/build-npm.sh
    - name: Install the package test dependencies
      working-directory: packages/ptome/test/npm
      run: npm ci
    - name: Run the package tests (API, exports, contents, bundler, browser)
      working-directory: packages/ptome/test/npm
      env:
        CHROMIUM_PATH: /usr/bin/google-chrome
      run: node --test
    - name: Check the type declarations
      working-directory: packages/ptome/test/npm
      run: npm run types
    - name: Lint the package (publint, are-the-types-wrong)
      working-directory: packages/ptome/test/npm
      run: npm run lint
    - name: Check the package for npm (dry run, nothing is published)
      working-directory: packages/ptome/build/npm
      run: npm publish --dry-run
    - name: Run the Dart tests on Node.js
      run: dart test -p node -x corpus
    - name: Install bats
      run: sudo npm i -g bats
    - name: Run e2e CLI tests (Node CLI)
      env:
        ASCIIDOCTOR_EXE: test/e2e/bin/ptome-node
      run: bats test/e2e/
