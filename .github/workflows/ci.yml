name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  dart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies
      run: dart pub get
    - name: Analyze Dart code
      run: dart analyze --fatal-infos .
    - name: Check Dart formatting
      run: dart format --output=none --set-exit-if-changed .
    - name: Run Dart tests
      run: dart test
    - name: Check that the public API is closed
      run: dart run tool/api_check.dart
    - name: Check that the JavaScript projection is up to date
      run: dart run tool/generate_js.dart --check
  e2e:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies
      run: dart pub get
    - name: Set up Ruby (oracle only)
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
    - name: Install asciidoctor gem (e2e oracle)
      run: gem install asciidoctor -v 2.0.26 --no-document
    - name: Install bats
      run: sudo npm i -g bats
    - name: Run e2e CLI tests (Dart)
      env:
        ASCIIDOCTOR_EXE: test/e2e/bin/asciidart
      run: bats test/e2e/
    - name: Run e2e CLI tests (Ruby oracle)
      env:
        ASCIIDOCTOR_EXE: test/e2e/bin/asciidoctor-ruby
      run: bats test/e2e/
    - name: Run differential selfcheck
      run: bats test/differential/
  dart-exe-e2e:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Build Dart executable
      run: ./tool/build-exes.sh
    - name: Set up Ruby (oracle only)
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
    - name: Install asciidoctor gem (parity oracle)
      # No optional gems: asciidart highlights with highlight.js only, and
      # Rouge, Pygments and CodeRay behave as when their gems are missing.
      run: gem install asciidoctor -v 2.0.26 --no-document
    - name: Install bats
      run: sudo npm i -g bats
    - name: Run e2e CLI tests (Dart exe)
      run: |
        EXE="$(pwd)/dist/$(ls dist | grep '^asciidart-linux-')"
        echo "ASCIIDOCTOR_EXE=$EXE"
        ASCIIDOCTOR_EXE="$EXE" bats test/e2e/
    - name: Run divergence tests (asciidart differs from the gem on purpose)
      run: |
        EXE="$(pwd)/dist/$(ls dist | grep '^asciidart-linux-')"
        ASCIIDOCTOR_EXE="$EXE" bats test/divergences/
    - name: Check byte-identical parity with Asciidoctor 2.0.26
      run: ./tool/parity.sh "dist/$(ls dist | grep '^asciidart-linux-')"
    - name: Install asciidoctor-epub3 gem (EPUB oracle)
      run: gem install asciidoctor-epub3 -v 2.3.0 --no-document
    - name: Download EPUBCheck
      run: |
        curl -sSLo "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
        unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
    - name: Check EPUB parity with asciidoctor-epub3 2.3.0
      run: >-
        dart run tool/epub_parity.dart
        --exe-a "$(command -v asciidoctor-epub3)"
        --exe-b "$(pwd)/dist/$(ls dist | grep '^asciidart-linux-')"
        --epubcheck "$RUNNER_TEMP/epubcheck-5.4.0/epubcheck.jar"
        $(find vendor/asciidoctor-epub3/test/fixtures -name '*.adoc' | sort)
  npm:
    strategy:
      fail-fast: false
      matrix:
        # The engines floor in npm/package.json, and the current LTS.
        node: ['20.19', 'lts/*']
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
    - name: Build the npm package
      run: ./tool/build-npm.sh
    - name: Install the package test dependencies
      working-directory: test/npm
      run: npm ci
    - name: Run the package tests (API, exports, contents, bundler, browser)
      working-directory: test/npm
      env:
        CHROMIUM_PATH: /usr/bin/google-chrome
      run: node --test
    - name: Check the type declarations
      working-directory: test/npm
      run: npm run types
    - name: Lint the package (publint, are-the-types-wrong)
      working-directory: test/npm
      run: npm run lint
    - name: Check the package for npm (dry run, nothing is published)
      working-directory: build/npm
      run: npm publish --dry-run
    - name: Run the Dart tests on Node.js
      run: dart test -p node
    - name: Set up Ruby (oracle only)
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
    - name: Install asciidoctor gem (parity oracle)
      run: gem install asciidoctor -v 2.0.26 --no-document
    - name: Install bats
      run: sudo npm i -g bats
    - name: Run e2e CLI tests (Node CLI)
      env:
        ASCIIDOCTOR_EXE: test/e2e/bin/asciidart-node
      run: bats test/e2e/
    - name: Check byte-identical parity with Asciidoctor 2.0.26 (Node CLI)
      run: ./tool/parity.sh test/e2e/bin/asciidart-node
