name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies
      run: dart pub get
    - name: Analyze Dart code
      run: dart analyze --fatal-infos .
    - name: Check Dart formatting
      run: dart format --output=none --set-exit-if-changed .
    - name: Run Dart tests
      run: dart test
    - name: Check that the public API is closed
      run: dart run tool/api_check.dart
  e2e:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies
      run: dart pub get
    - name: Set up Ruby (oracle only)
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
    - name: Install asciidoctor gem (e2e oracle)
      run: gem install asciidoctor -v 2.0.26 --no-document && gem install coderay pygments.rb --no-document
    - name: Install bats
      run: sudo npm i -g bats
    - name: Run e2e CLI tests (Dart)
      env:
        ASCIIDOCTOR_EXE: test/e2e/bin/asciidoctor-dart
      run: bats test/e2e/
    - name: Run e2e CLI tests (Ruby oracle)
      env:
        ASCIIDOCTOR_EXE: test/e2e/bin/asciidoctor-ruby
      run: bats test/e2e/
    - name: Run differential selfcheck
      run: bats test/differential/
  dart-exe-e2e:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Build Dart executable
      run: ./tool/build-exes.sh
    - name: Set up Ruby (oracle only)
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
    - name: Install asciidoctor gem (parity oracle)
      # coderay must be present so the oracle highlights the CodeRay fixtures
      # the way the Dart port does.
      run: gem install asciidoctor -v 2.0.26 --no-document && gem install coderay pygments.rb --no-document
    - name: Install bats
      run: sudo npm i -g bats
    - name: Run e2e CLI tests (Dart exe)
      run: |
        EXE="$(pwd)/dist/$(ls dist | grep '^asciidoctor-linux-')"
        echo "ASCIIDOCTOR_EXE=$EXE"
        ASCIIDOCTOR_EXE="$EXE" bats test/e2e/
    - name: Check byte-identical parity with Asciidoctor 2.0.26
      run: ./tool/parity.sh "dist/$(ls dist | grep '^asciidoctor-linux-')"
