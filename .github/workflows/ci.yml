name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
# ptome's jobs run in its package folder (the repository is a pub
# workspace, ADR-0018).
defaults:
  run:
    working-directory: packages/ptome
jobs:
  workspace:
    # Every package: analysis and formatting over the whole workspace, the
    # libraries' tests and API snapshots (ptome's are in the jobs below).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies (the whole workspace)
      run: dart pub get
    - name: Analyze every package
      run: dart analyze --fatal-infos .
    - name: Check formatting
      run: dart format --output=none --set-exit-if-changed .
    - name: Test the libraries
      run: |
        for pkg in packages/plain_*/; do
          echo "::group::$pkg"
          (cd "$pkg" && dart test)
          echo "::endgroup::"
        done
    - name: Check the libraries' public APIs against their snapshots
      if: matrix.os == 'ubuntu-latest'
      run: |
        for pkg in packages/plain_*/; do
          [ -f "$pkg/tool/api_check.dart" ] || continue
          (cd "$pkg" && dart run tool/api_check.dart)
        done
  publishable:
    # Each package would publish: no errors or warnings in a dry run (but
    # depending on siblings not released yet; tool/publish_check.sh).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies (the whole workspace)
      run: dart pub get
    - name: Dry-run publishing every package
      run: tool/publish_check.sh
  standalone:
    # Each package resolved on its own against its siblings' published
    # versions (in the workspace they always resolve locally); packages
    # whose siblings aren't published yet are skipped.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Resolve and analyze each package alone
      run: tool/standalone.sh
  gate:
    # The full gate's ptome part (tool/gate.sh ptome): every test with the
    # coverage floor, the corpus held to its red list, the API and
    # JavaScript projection, the CLI on the executable. The workspace job
    # runs the plain_* packages and the npm job Node.js; live oracles run
    # nightly (nightly.yml).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies (the whole workspace)
      run: dart pub get
    - name: Install poppler, qpdf, unzip and bats
      run: |
        sudo apt-get update -q && sudo apt-get install -y -q poppler-utils qpdf unzip
        sudo npm i -g bats
    - name: Run the full gate's ptome part
      run: tool/gate.sh ptome
  dart:
    # The tests on the other systems, but the slow ones and the corpus
    # (nightly.yml runs those there).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies
      run: dart pub get
    - name: Run Dart tests
      run: dart test -x corpus -x slow
  npm:
    # The npm package and the Dart tests on Node.js's current LTS.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Build the npm package
      run: ./tool/build-npm.sh
    - name: Install the package test dependencies
      working-directory: packages/ptome/test/npm
      run: npm ci
    - name: Run the package tests (API, exports, contents, bundler, browser)
      working-directory: packages/ptome/test/npm
      env:
        CHROMIUM_PATH: /usr/bin/google-chrome
      run: node --test
    - name: Check the type declarations
      working-directory: packages/ptome/test/npm
      run: npm run types
    - name: Lint the package (publint, are-the-types-wrong)
      working-directory: packages/ptome/test/npm
      run: npm run lint
    - name: Check the package for npm (dry run, nothing is published)
      working-directory: packages/ptome/build/npm
      run: npm publish --dry-run
    - name: Run the Dart tests on Node.js
      run: dart test -p node -x corpus
    - name: Install bats
      run: sudo npm i -g bats
    - name: Run e2e CLI tests (Node CLI)
      env:
        ASCIIDOCTOR_EXE: test/e2e/bin/ptome-node
      run: bats test/e2e/
