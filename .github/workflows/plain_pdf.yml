name: plain_pdf
on:
  push:
    branches: ['**']
    paths:
    - 'packages/plain_pdf/**'
    - 'packages/plain_fonts/**'
    - 'packages/plain_compression/**'
    - 'packages/plain_unicode/**'
    - 'packages/plain_math/**'
    - 'packages/plain_typesetting/**'
    - '.github/workflows/plain_pdf.yml'
  pull_request:
    paths:
    - 'packages/plain_pdf/**'
    - 'packages/plain_fonts/**'
    - 'packages/plain_compression/**'
    - 'packages/plain_unicode/**'
    - 'packages/plain_math/**'
    - 'packages/plain_typesetting/**'
    - '.github/workflows/plain_pdf.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
defaults:
  run:
    working-directory: packages/plain_pdf
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies
      run: dart pub get
    - name: Check that JavaScript writes the same bytes as the VM
      run: |
        dart compile js -O2 -o build/web_check.js tool/web_check.dart
        vm="$(dart run tool/web_check.dart)"
        js="$(node build/web_check.js)"
        echo "VM: $vm"; echo "JS: $js"
        test "$vm" = "$js"
  pdf-tools:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies
      run: dart pub get
    - name: Install qpdf, poppler, ImageMagick and librsvg
      run: sudo apt-get update -q && sudo apt-get install -yq qpdf poppler-utils imagemagick librsvg2-bin
    - name: Run the tests that check output with qpdf, poppler, ImageMagick and librsvg
      run: dart test --tags pdf-tools
