name: Release check
# Rehearses a release of a tag on pub.dev and npm without publishing
# anything: both registries are only asked for a dry run. Publishing is a
# separate, manual step.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
permissions: read-all
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
    - name: Check that the tag matches the package versions
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        tag="${GITHUB_REF_NAME#v}"
        pub="$(sed -n 's/^version: //p' pubspec.yaml)"
        npm="$(node -p "require('./npm/package.json').version")"
        echo "tag $tag, pubspec $pub, npm $npm"
        test "$tag" = "$pub" && test "$tag" = "$npm"
    - name: Install Dart dependencies
      run: dart pub get
    - name: pub.dev dry run
      run: dart pub publish --dry-run
    - name: Build the npm package
      run: ./tool/build-npm.sh
    - name: npm dry run
      working-directory: build/npm
      run: npm publish --dry-run
