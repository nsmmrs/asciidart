name: Report a bug
description: >-
  Report a problem with ptome (the Dart library, the ptome
  command or the ptome npm package).
labels: [bug]
body:
- type: markdown
  attributes:
    value: >-
      ptome aims to convert documents as Asciidoctor 2.0.26 (the Ruby
      gem) does. Output that differs from the gem is a bug unless
      benchmark/PARITY.md lists the difference as intentional. For a
      security problem, open a minimal issue asking for a private channel
      instead of describing it here.
- type: dropdown
  id: package
  attributes:
    label: Package
    options:
    - Dart library (ptome)
    - ptome command
    - npm package (ptome)
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Version
    description: Run `ptome --version` and paste the output.
    placeholder: "Ptome 0.1.0 (compatible with Asciidoctor 2.0.26) [https://github.com/nsmmrs/ptome] Runtime Environment (Dart ...)"
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Description
    description: What went wrong?
  validations:
    required: true
- type: textarea
  id: reproducer
  attributes:
    label: Sample document
    description: A minimal AsciiDoc document that shows the problem, and the command or code you ran.
    render: asciidoc
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual output
    description: The output or error you got.
  validations:
    required: true
- type: textarea
  id: gem
  attributes:
    label: Output of the Asciidoctor 2.0.26 gem
    description: If you can, the gem's output for the same document and options (`gem install asciidoctor -v 2.0.26`).
