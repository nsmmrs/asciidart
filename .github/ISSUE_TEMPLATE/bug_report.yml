name: Report a bug
description: >-
  Report a problem with asciidart (the Dart library, the asciidart
  command or the asciidart npm package).
labels: [bug]
body:
- type: markdown
  attributes:
    value: >-
      asciidart aims to convert documents as Asciidoctor 2.0.26 (the Ruby
      gem) does. Output that differs from the gem is a bug unless
      benchmark/PARITY.md lists the difference as intentional. For a
      security problem, open a minimal issue asking for a private channel
      instead of describing it here.
- type: dropdown
  id: package
  attributes:
    label: Package
    options:
    - Dart library (asciidart)
    - asciidart command
    - npm package (asciidart)
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Version
    description: Run `asciidart --version` and paste the output.
    placeholder: "Asciidart 0.1.0 (compatible with Asciidoctor 2.0.26) [https://github.com/nsmmrs/asciidart] Runtime Environment (Dart ...)"
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Description
    description: What went wrong?
  validations:
    required: true
- type: textarea
  id: reproducer
  attributes:
    label: Sample document
    description: A minimal AsciiDoc document that shows the problem, and the command or code you ran.
    render: asciidoc
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual output
    description: The output or error you got.
  validations:
    required: true
- type: textarea
  id: gem
  attributes:
    label: Output of the Asciidoctor 2.0.26 gem
    description: If you can, the gem's output for the same document and options (`gem install asciidoctor -v 2.0.26`).
