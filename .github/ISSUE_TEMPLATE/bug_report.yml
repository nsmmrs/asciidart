name: Report a bug
description: >-
  Report a problem with the Dart port (the pub package, the asciidoctor
  command or the asciidoctor-dart npm package).
labels: [bug]
body:
- type: markdown
  attributes:
    value: >-
      This port aims to convert documents exactly as Asciidoctor 2.0.26 (the
      Ruby gem) does. Output that differs from the gem is a bug. For a
      security problem, open a minimal issue asking for a private channel
      instead of describing it here.
- type: dropdown
  id: package
  attributes:
    label: Package
    options:
    - Dart library (asciidoctor on pub.dev)
    - asciidoctor command
    - npm package (asciidoctor-dart)
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Version
    description: Run `asciidoctor --version` (or `asciidoctor-dart --version`) and paste the output.
    placeholder: "Asciidoctor 2.0.26 [https://asciidoctor.org] Runtime Environment (asciidoctor-dart 0.1.0; ...)"
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Description
    description: What went wrong?
  validations:
    required: true
- type: textarea
  id: reproducer
  attributes:
    label: Sample document
    description: A minimal AsciiDoc document that shows the problem, and the command or code you ran.
    render: asciidoc
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual output
    description: The output or error you got.
  validations:
    required: true
- type: textarea
  id: gem
  attributes:
    label: Output of the Asciidoctor 2.0.26 gem
    description: If you can, the gem's output for the same document and options (`gem install asciidoctor -v 2.0.26`).
