name: Suggest an improvement
description: >-
  Suggest a change to the Dart port: its APIs, the command, the npm package,
  packaging or performance.
labels: [enhancement]
body:
- type: markdown
  attributes:
    value: >-
      Converted output follows Asciidoctor 2.0.26 exactly, so changes to the
      AsciiDoc language or to what the converters produce belong upstream
      (https://github.com/asciidoctor/asciidoctor). Suggestions about this
      port's own interfaces are welcome here.
- type: textarea
  id: description
  attributes:
    label: Description
    description: What would you like to change?
  validations:
    required: true
- type: textarea
  id: use_case
  attributes:
    label: Use case
    description: What would it let you do?
  validations:
    required: true
